name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,build]"
      - run: python -m pytest
      - run: nicheir example --geometry halfplane --output-dir example_run/halfplane
      - run: nicheir example --geometry corner --output-dir example_run/corner
      - run: nicheir train-example --epochs 2 --output-dir training_example
      - run: python -m build
